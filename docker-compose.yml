# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: node-admin-db
    environment:
      POSTGRES_DB: admin_api
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data: